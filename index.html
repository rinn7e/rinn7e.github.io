<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The title, the description, the canonical URL, the social card and
         the structured data come from `src/common/seo.ts`: the build writes
         them here for each page (`vite.config.ts`) -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="author" content="%SEO_PERSON%" />
    <link rel="canonical" href="%SEO_URL%" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="%SEO_FEED_TITLE%"
      href="%SEO_FEED_URL%"
    />
    <meta property="og:type" content="%SEO_TYPE%" />
    <meta property="og:site_name" content="%SEO_HANDLE%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_URL%" />
    <meta property="og:image" content="%SEO_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%" />
    <meta property="profile:username" content="%SEO_HANDLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_IMAGE%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/root.tsx"></script>
  </body>
</html>
