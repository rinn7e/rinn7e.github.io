<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rinn7e</title>
    <meta name="description" content="The open source products of rinn7e, coming soon." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #0b0908;
        --muted: #5b5652;
        --line: #d9d5d1;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0908;
          --ink: #f4f1ee;
          --muted: #a29c97;
          --line: #3a3532;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        max-width: 32rem;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      hr {
        width: 3rem;
        border: 0;
        border-top: 1px solid var(--line);
        margin: 0.25rem 0;
      }
      a {
        color: var(--ink);
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="favicon.svg" alt="R7 logo" />
      <h1>rinn7e</h1>
      <p>A showcase of my open source products is coming here soon.</p>
      <hr />
      <p>Meanwhile, my personal site is at <a href="https://me.rinn7e.com/">me.rinn7e.com</a>.</p>
    </main>
  </body>
</html>
