<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e8edf3"/>
    </pattern>
    <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#047857" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="#ffffff"/>
  <rect width="1200" height="640" rx="28" fill="url(#dots)"/>
  <text x="600" y="78" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Every app is a state machine</text>
  <text x="600" y="118" text-anchor="middle" font-size="20" fill="#64748b">The log is written before decide, or after it</text>
  <rect x="58.0" y="300" width="180" height="96" rx="16" fill="#0891b214" stroke="#0891b2" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="148.0" y="343.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Command</text>
  <text x="148.0" y="370.0" text-anchor="middle" font-size="16" fill="#0891b2" font-family="'JetBrains Mono', Menlo, Consolas, monospace">PublishNote n1</text>
  <rect x="284.0" y="300" width="180" height="96" rx="16" fill="#0891b214" stroke="#0891b2" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="374.0" y="343.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">decide</text>
  <text x="374.0" y="370.0" text-anchor="middle" font-size="16" fill="#0891b2">what changes?</text>
  <rect x="510.0" y="300" width="180" height="96" rx="16" fill="#7c3aed14" stroke="#7c3aed" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="600.0" y="343.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Event</text>
  <text x="600.0" y="370.0" text-anchor="middle" font-size="16" fill="#7c3aed" font-family="'JetBrains Mono', Menlo, Consolas, monospace">NotePublished n1</text>
  <rect x="736.0" y="300" width="180" height="96" rx="16" fill="#7c3aed14" stroke="#7c3aed" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="826.0" y="343.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">apply</text>
  <text x="826.0" y="370.0" text-anchor="middle" font-size="16" fill="#7c3aed">make it so</text>
  <rect x="962.0" y="300" width="180" height="96" rx="16" fill="#04785714" stroke="#047857" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="1052.0" y="343.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">State</text>
  <text x="1052.0" y="370.0" text-anchor="middle" font-size="16" fill="#047857">n1 is public</text>
  <path d="M238.0 348.0 L278.0 348.0" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c)"/>
  <path d="M464.0 348.0 L504.0 348.0" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c)"/>
  <path d="M690.0 348.0 L730.0 348.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#v)"/>
  <path d="M916.0 348.0 L956.0 348.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#v)"/>
  <rect x="30.0" y="186" width="340" height="40" rx="20" fill="#0891b21f" stroke="#0891b2" stroke-width="1.4"/>
  <text x="200.0" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2" letter-spacing="2.5">COMMAND SOURCING LOGS THIS</text>
  <line x1="148.0" y1="226" x2="148.0" y2="292" stroke="#0891b2" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="430.0" y="186" width="340" height="40" rx="20" fill="#7c3aed1f" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="600.0" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed" letter-spacing="2.5">EVENT SOURCING LOGS THIS</text>
  <line x1="600.0" y1="226" x2="600.0" y2="292" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="374.0" y="426" text-anchor="middle" font-size="15" fill="#e11d48">a refusal happens before the log, in check</text>
  <path d="M1052.0 396 L1052.0 520 L374.0 520 L374.0 442" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
  <text x="600" y="506" text-anchor="middle" font-size="15" fill="#047857">the next decision reads the new state</text>
</svg>
