<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b"/>
    </pattern>
    <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="800" rx="28" fill="#0f172a"/>
  <rect width="1200" height="800" rx="28" fill="url(#dots)"/>
  <text x="600" y="78" text-anchor="middle" font-size="40" font-weight="800" fill="#f1f5f9" letter-spacing="-0.5">Two ways to keep the log</text>
  <text x="600" y="118" text-anchor="middle" font-size="20" fill="#94a3b8">Same request, same result: only what is written down differs</text>
  <rect x="450.0" y="160" width="300" height="78" rx="16" fill="#94a3b810" stroke="#94a3b8" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="600" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">User asks</text>
  <text x="600" y="221.0" text-anchor="middle" font-size="16" fill="#94a3b8" font-family="'JetBrains Mono', Menlo, Consolas, monospace">PublishNote n1</text>
  <text x="330" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2.5">COMMAND SOURCING</text>
  <text x="330" y="326" text-anchor="middle" font-size="15" fill="#94a3b8">stores what was asked</text>
  <text x="870" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="2.5">EVENT SOURCING</text>
  <text x="870" y="326" text-anchor="middle" font-size="15" fill="#94a3b8">stores what happened</text>
  <path d="M450 199 L330 199 L330 272" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c)"/>
  <path d="M750 199 L870 199 L870 272" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#v)"/>
  <rect x="170.0" y="350" width="320" height="76" rx="16" fill="#fbbf2414" stroke="#fbbf24" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="330" y="383.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">LOG</text>
  <text x="330" y="410.0" text-anchor="middle" font-size="16" fill="#fbbf24" font-family="'JetBrains Mono', Menlo, Consolas, monospace">PublishNote n1</text>
  <rect x="170.0" y="460" width="320" height="76" rx="16" fill="#22d3ee14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="330" y="493.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">decide</text>
  <text x="330" y="520.0" text-anchor="middle" font-size="16" fill="#22d3ee">the rules run</text>
  <rect x="170.0" y="570" width="320" height="76" rx="16" fill="#22d3ee14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="330" y="603.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9" font-family="'JetBrains Mono', Menlo, Consolas, monospace">NotePublished</text>
  <text x="330" y="630.0" text-anchor="middle" font-size="16" fill="#22d3ee">the result</text>
  <rect x="710.0" y="350" width="320" height="76" rx="16" fill="#a78bfa14" stroke="#a78bfa" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="870" y="383.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">decide</text>
  <text x="870" y="410.0" text-anchor="middle" font-size="16" fill="#a78bfa">the rules run</text>
  <rect x="710.0" y="460" width="320" height="76" rx="16" fill="#fbbf2414" stroke="#fbbf24" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="870" y="493.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">LOG</text>
  <text x="870" y="520.0" text-anchor="middle" font-size="16" fill="#fbbf24" font-family="'JetBrains Mono', Menlo, Consolas, monospace">NotePublished n1</text>
  <rect x="710.0" y="570" width="320" height="76" rx="16" fill="#a78bfa14" stroke="#a78bfa" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="870" y="603.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">apply</text>
  <text x="870" y="630.0" text-anchor="middle" font-size="16" fill="#a78bfa">no rules</text>
  <path d="M330 426 L330 454" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c)"/>
  <path d="M330 536 L330 564" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c)"/>
  <path d="M870 426 L870 454" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#v)"/>
  <path d="M870 536 L870 564" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#v)"/>
  <path d="M170.0 388.0 L100.0 388.0 L100.0 498.0 L164.0 498.0" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#a)"/>
  <text x="82.0" y="443.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fbbf24" transform="rotate(-90 82.0 443.0)">replay runs the rules</text>
  <path d="M1030.0 498.0 L1100.0 498.0 L1100.0 608.0 L1036.0 608.0" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#a)"/>
  <text x="1118.0" y="553.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fbbf24" transform="rotate(90 1118.0 553.0)">replay only applies</text>
  <rect x="480.0" y="690" width="240" height="66" rx="16" fill="#34d39912" stroke="#34d399" stroke-opacity="0.85" stroke-width="1.6"/>
  <text x="600" y="730.0" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f5f9">State</text>
  <path d="M330 646 L330 723 L474 723" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c)"/>
  <path d="M870 646 L870 723 L726 723" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#v)"/>
</svg>
